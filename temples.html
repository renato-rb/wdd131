<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temple Album | Renato Rodrigues Blanco</title>
  <meta name="description"
    content="A responsive picture album of temples of The Church of Jesus Christ of Latter-day Saints, built for WDD131.">
  <meta name="author" content="Renato Rodrigues Blanco">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Open+Sans:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/temples.css">
  <link rel="stylesheet" href="styles/temples-large.css">
  <script src="scripts/temples.js" defer></script>
</head>

<body>
  <header>
    <span class="site-title">Temple Album</span>
    <button id="menu" aria-label="Toggle navigation menu" aria-expanded="false"></button>
    <nav id="navigation">
      <a href="#" class="active" title="Home">Home</a>
      <a href="#" title="Old temples">Old</a>
      <a href="#" title="New temples">New</a>
      <a href="#" title="Large temples">Large</a>
      <a href="#" title="Small temples">Small</a>
    </nav>
  </header>

  <main>
    <h1>Home</h1>
    <div class="album">
      <figure>
        <img src="images/madrid-spain-temple.webp" alt="Madrid Spain Temple" width="400" height="250" loading="lazy">
        <figcaption>Madrid Spain</figcaption>
      </figure>
      <figure>
        <img src="images/rome-italy-temple.webp" alt="Rome Italy Temple" width="400" height="250" loading="lazy">
        <figcaption>Rome Italy</figcaption>
      </figure>
      <figure>
        <img src="images/sao-paulo-brazil-temple.webp" alt="São Paulo Brazil Temple" width="400" height="250"
          loading="lazy">
        <figcaption>São Paulo Brazil</figcaption>
      </figure>
      <figure>
        <img src="images/curitiba-brazil-temple.webp" alt="Curitiba Brazil Temple" width="400" height="250"
          loading="lazy">
        <figcaption>Curitiba Brazil</figcaption>
      </figure>
      <figure>
        <img src="images/campinas-brazil-temple.webp" alt="Campinas Brazil Temple" width="400" height="250"
          loading="lazy">
        <figcaption>Campinas Brazil</figcaption>
      </figure>
      <figure>
        <img src="images/recife-brazil-temple.webp" alt="Recife Brazil Temple" width="400" height="250" loading="lazy">
        <figcaption>Recife Brazil</figcaption>
      </figure>
      <figure>
        <img src="images/porto-alegre-brazil-temple.webp" alt="Porto Alegre Brazil Temple" width="400" height="250"
          loading="lazy">
        <figcaption>Porto Alegre Brazil</figcaption>
      </figure>
      <figure>
        <img src="images/manaus-brazil-temple.webp" alt="Manaus Brazil Temple" width="400" height="250" loading="lazy">
        <figcaption>Manaus Brazil</figcaption>
      </figure>
      <figure>
        <img src="images/buenos-aires-argentina-temple.webp" alt="Buenos Aires Argentina Temple" width="400"
          height="250" loading="lazy">
        <figcaption>Buenos Aires Argentina</figcaption>
      </figure>
    </div>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> | Renato Rodrigues Blanco | Spain</p>
    <p id="lastModified"></p>
  </footer>
</body>

</html>
